settings:
  namespace_roots:
    code/src: Src
    code/tests: Tests
  source_extension: ".js"
  test_suffix: ".spec"
  test_extension: ".js"
  namespace_separator: "."

coverage_xml: .parity/per-test
min_coverage: 70
min_coverage_global: 80
min_matched_coverage: 40

test:
  command: "cd code && ./node_modules/.bin/nyc --clean --all --include='src/**/*.js' --reporter=clover --report-dir=$(dirname {coverage}) ./node_modules/.bin/mocha {test_abs}"
  coverage: ".parity/tmp/{slug}/clover.xml"
  reports: ".parity/per-test"
  timeout: 300

structure:
  - name: "Mocha sample"
    paths:
      source: "code/src"
      test: "code/tests"
    rules:
      - minimum-coverage:
          min: 70
      - matched-coverage:
          min: 40
